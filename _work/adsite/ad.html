<!DOCTYPE html>

<body>
<div id="stage">
  <div class="layer" id="bg"></div>
  <div class="layer" id="scenes"></div>
  <div class="layer" id="vidlayer" style="opacity:0"></div>
  <div class="layer" id="proofchrome" style="opacity:0"></div>
  <div class="layer" id="chrome"></div>

<script>
/* ============================ easing ============================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const prog=(T,s,d)=>clamp((T-s)/d,0,1);
const eOut=t=>1-Math.pow(1-t,3);
const eIn=t=>t*t*t;
const eOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const eOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const ENTER=(T,s,d=.65)=>eOut(prog(T,s,d));
const POP=(T,s,d=.6)=>eOutBack(prog(T,s,d));
const EXIT=(T,s,d=.4)=>eIn(prog(T,s,d));
const vis=(T,a,b,fi=.45,fo=.4)=>ENTER(T,a,fi)*(1-EXIT(T,b-fo,fo));
const smooth=t=>t*t*(3-2*t);
const XF=0.40;                                   // scene crossfade length
/* Full opacity between inAt and outAt; complementary ramps either side so
   consecutive scenes always sum to 1 — no dip to the bare backdrop. */
function sceneO(T,inAt,outAt){
  let o=1;
  if(T<inAt) o=smooth(clamp((T-inAt+XF)/XF,0,1));
  if(T>outAt) o=Math.min(o,1-smooth(clamp((T-outAt)/XF,0,1)));
  return o;
}
const SB=0.40;                                   // inner-animation lead

/* ============================ timeline ============================ */
const TL={
  hook:     {s: 0.0,  e: 3.4},
  symptoms: {s: 3.4,  e: 9.9},
  wait:     {s: 9.9,  e:13.9},
  turn:     {s:13.9,  e:19.7},
  protocol: {s:19.7,  e:25.3},
  proofin:  {s:25.3,  e:27.7},
  proof:    {s:27.7,  e:44.3},
  quotes:   {s:44.3,  e:49.8},
  care:     {s:49.8,  e:53.9},
  cta:      {s:53.9,  e:59.5},
};
const DURATION=59.5;
const PROOF_SRC_IN=0.4, PROOF_LEN=16.6;
window.__DURATION=DURATION;

/* ============================ backdrop ============================ */
const BG=document.getElementById('bg');
function glow(x,y,r,c,o){return `<div style="position:absolute;left:${x-r}px;top:${y-r}px;width:${r*2}px;height:${r*2}px;border-radius:50%;background:radial-gradient(circle,${c} 0%,transparent 66%);opacity:${o}"></div>`;}
function renderBG(T){
  const w=T*0.20;
  const warm=ENTER(T,13.6,1.6)*(1-EXIT(T,44.2,.8));
  const cool=ENTER(T,0,1.2)*(1-ENTER(T,13.4,1.0));
  const cta=ENTER(T,53.6,1.0);
  const px=540+Math.sin(w*0.9)*90, py=1150+Math.cos(w*0.75)*140;
  BG.innerHTML=`
  <div style="position:absolute;inset:0;background:radial-gradient(140% 90% at 50% 8%,#0D241D 0%,#071813 42%,#04100C 100%)"></div>
  ${glow(px,py,780,'#14513A',.55+.2*warm)}
  ${glow(180+Math.cos(w)*120,430+Math.sin(w*1.1)*130,560,'#0F3A2A',.5*cool+.18)}
  ${glow(920,320+Math.sin(w*.8)*120,520,'#2A2410',.55*warm)}
  ${glow(560,1730,640,'#1E6A4B',.10+.14*warm)}

  <div style="position:absolute;inset:0;opacity:.32;background-image:radial-gradient(rgba(162,209,113,.30) 1.4px,transparent 1.6px);background-size:52px 52px;background-position:${Math.round(-T*7)}px 0px"></div>
  <div style="position:absolute;left:50%;top:${-560+Math.sin(w*.5)*30}px;transform:translateX(-50%) rotate(${-12+Math.sin(T*.10)*3}deg);opacity:${.022+.016*warm};filter:blur(1.5px);
       width:1420px;height:1420px;background:url(assets/mark-cream.png) center/contain no-repeat"></div>`;
}

/* ============================ chrome ============================ */
const CHROME=document.getElementById('chrome');

/* ============================ 1 · HOOK ============================ */
function scHook(T){
  const {s,e}=TL.hook; const o=sceneO(T,0.46,3.18); if(o<=0) return '';
  const Sb=s-SB;

}

/* ============================ 2 · SYMPTOMS ============================ */
const ICONS={

  eye:'<path d="M2 12s3.7-6.4 10-6.4S22 12 22 12s-3.7 6.4-10 6.4S2 12 2 12Z"/><circle cx="12" cy="12" r="2.9"/>',
  drop:'<path d="M12 3.2s6.3 6.4 6.3 10.6A6.3 6.3 0 0 1 5.7 13.8C5.7 9.6 12 3.2 12 3.2Z"/>',
  pulse:'<path d="M2.5 12.5h4l2.2-6 3.4 12 2.6-8 1.6 4h5.2"/>',

};
function scSymptoms(T){
  const {s,e}=TL.symptoms; const o=sceneO(T,3.58,9.68); if(o<=0) return '';
  const Sb=s-SB;
    ['moon','Tired even after a full night&rsquo;s sleep'],
    ['eye','Yellow tinge in your eyes or skin'],
    ['drop','Dark urine, pale stool'],
    ['pulse','Pain or swelling on the right side'],

  ];
  const item=(r,i)=>{
    const at=Sb+.72+i*.44, p=POP(T,at,.62), op=ENTER(T,at,.32);
    const hot=i===rows.length-1;
    return `<div class="card" style="display:flex;align-items:center;gap:26px;padding:${hot?'28px 30px':'25px 30px'};margin-bottom:${hot?0:19}px;
      opacity:${op};transform:translateX(${(1-p)*70}px) scale(${.97+.03*p});
      ${hot?`background:linear-gradient(120deg,rgba(201,162,39,.20),rgba(201,162,39,.06));border-color:rgba(232,201,106,.55);
        box-shadow:0 0 52px rgba(201,162,39,${.16+.10*Math.sin((T-at)*2.2)})`:''}">
      <div style="width:62px;height:62px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
        background:${hot?'rgba(232,201,106,.18)':'rgba(162,209,113,.13)'};border:1.5px solid ${hot?'rgba(232,201,106,.55)':'rgba(162,209,113,.30)'}">
        <svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="${hot?'#E8C96A':'#A2D171'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[r[0]]}</svg></div>
      <div style="font-size:${hot?35:34}px;font-weight:${hot?700:600};color:${hot?'#F3E4BE':'var(--cream)'};line-height:1.25">${r[1]}</div>

/* ============================ 3 · THE WAIT ============================ */
function scWait(T){
  const {s,e}=TL.wait; const o=sceneO(T,10.08,13.68); if(o<=0) return '';
  const Sb=s-SB;
  const grow=eOutExpo(prog(T,Sb+1.15,2.0));
  const N=12, G=46;
  const dots=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const idx=y*N+x, th=1-idx/(N*N-1);
    const on=clamp((grow-th*0.55)*2.2,0,1);
    if(on<=0.01) continue;
    const d=Math.hypot(x-(N-1)/2,y-(N-1)/2)/(N*0.72);
    dots.push(`<span style="position:absolute;left:${x*G}px;top:${y*G}px;width:13px;height:13px;border-radius:50%;
      background:${d>.55?'#E4593F':'#A2D171'};opacity:${on*(0.28+0.72*(1-d))};transform:scale(${on})"></span>`);
  }
  const count=Math.round(2_000_000*eOut(prog(T,Sb+1.3,2.2)));
  const cO=ENTER(T,Sb+1.35,.7);
  return `<div class="layer" style="opacity:${o}">
    <div style="position:absolute;left:88px;right:88px;top:378px;text-align:center">
      <div class="kicker" style="justify-content:center;opacity:${a}"><i style="width:34px;background:linear-gradient(90deg,transparent,var(--gold))"></i>What you were told<i style="width:34px;background:linear-gradient(90deg,var(--gold),transparent)"></i></div>
      <div class="serif" style="margin-top:34px;font-size:96px;opacity:${a};transform:translateY(${(1-a)*32}px)">
        &ldquo;Monitor it.<br>And <em style="font-style:italic;color:var(--gold2)">wait</em>.&rdquo;</div>
      <div style="margin-top:46px;font-size:37px;font-weight:600;color:rgba(220,239,227,.80);opacity:${b};transform:translateY(${(1-b)*24}px);line-height:1.5">
        But the virus does not wait.<br>It copies itself <strong style="color:var(--red)">millions of times a day</strong>.</div>
    </div>
    <div style="position:absolute;left:50%;top:1082px;transform:translateX(-50%);width:${N*G}px;height:${N*G}px;opacity:${ENTER(T,Sb+1.0,.8)}">${dots.join('')}</div>
    <div style="position:absolute;left:88px;right:88px;bottom:196px;text-align:center;opacity:${cO};transform:translateY(${(1-cO)*22}px)">
      <div style="display:inline-flex;align-items:baseline;gap:18px;padding:24px 44px;border-radius:20px;background:rgba(228,89,63,.13);border:1.5px solid rgba(228,89,63,.42)">
        <span class="serif" style="font-size:82px;color:#F0A08C;font-variant-numeric:tabular-nums">${count.toLocaleString('en-US')}</span>
        <span style="font-size:25px;font-weight:800;letter-spacing:.14em;color:rgba(240,160,140,.9)">VIRAL COPIES / DAY</span>
      </div>
    </div>
  </div>`;
}

/* ============================ 4 · THE TURN ============================ */
function scTurn(T){
  const {s,e}=TL.turn; const o=sceneO(T,14.08,19.48); if(o<=0) return '';

      <div style="margin-top:50px;opacity:${lock};transform:scale(${.90+.10*lock})">

          return `<span class="chip" style="transform:translateY(${(1-q)*26}px) scale(${.94+.06*q})">${p}</span>`;}).join('')}
      </div>
      <div style="margin-top:120px;font-size:25px;font-weight:800;letter-spacing:.20em;color:rgba(220,239,227,.62);opacity:${tag}">SINCE 2011 · NIGERIA · WORLDWIDE CONSULT</div>
    </div>

/* ============================ 5 · PROTOCOL ============================ */
const PHASES=[
  {n:'01',t:'Cleanse &amp; Protect',w:'Weeks 1–4',c:'Hijama cupping · bitter detox infusions · liver-friendly nutrition'},
  {n:'02',t:'Fight &amp; Rebuild',w:'Weeks 5–12',c:'Phyllanthus niruri · black seed + raw honey · milk thistle'},

function scProtocol(T){
  const {s,e}=TL.protocol; const o=sceneO(T,19.88,25.08); if(o<=0) return '';

    const at=Sb+.62+i*.64, q=POP(T,at,.7), op=ENTER(T,at,.36);

      opacity:${op};transform:translateY(${(1-q)*50}px) scale(${.97+.03*q});
      ${active?`background:linear-gradient(120deg,rgba(63,163,114,.16),rgba(63,163,114,.04));border-color:rgba(162,209,113,.42)`:''}">

          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#E8C96A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.4 4.4L19 7.4"/></svg></div>
        <div style="font-size:27px;color:rgba(220,239,227,.82);font-weight:600">Personalised after your <strong style="color:var(--gold2)">free</strong> consultation · supervised weekly on WhatsApp</div>
      </div>
    </div>
  </div>`;
}

/* ============================ 6 · PROOF INTRO ============================ */
function scProofIn(T){
  const {s,e}=TL.proofin; const o=sceneO(T,25.48,27.62); if(o<=0) return '';
  const Sb=s-SB;
  const txtIn=ENTER(T,s+.12,.6), txtOut=EXIT(T,s+1.15,.6);
  const inset=lerp(250,78,lock), len=lerp(150,116,lock);
  const bracket=(rot,pos)=>`<div style="position:absolute;${pos};width:${len}px;height:${len}px;
     border-top:4px solid rgba(232,201,106,${.35+.55*lock});border-left:4px solid rgba(232,201,106,${.35+.55*lock});
     transform:rotate(${rot}deg);transform-origin:center"></div>`;
  return `<div class="layer" style="opacity:${o}">
